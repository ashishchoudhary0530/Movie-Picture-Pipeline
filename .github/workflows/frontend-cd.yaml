build:
  name: Build and Push
  needs: [lint, test]
  runs-on: ubuntu-latest
  defaults:
    run:
      working-directory: starter/frontend
  outputs:
    image_tag: ${{ steps.vars.outputs.image_tag }}
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set image tag
      id: vars
      run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: ecr-login
      uses: aws-actions/amazon-ecr-login@v2

    - name: Create ECR repository if it doesn't exist
      run: |
        aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }} || \
        aws ecr create-repository --repository-name ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }}

    - name: Build Docker image
      run: |
        docker build \
          --build-arg=REACT_APP_MOVIE_API_URL=http://localhost:5000 \
          --tag=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.image_tag }} \
          .

    - name: Push image to Amazon ECR
      run: |
        docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.image_tag }}